name: Bonkers Scraper

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          pip install pandas selenium

      - name: Run scraper
        run: |
          python scraper.py

      - name: Show output files
        if: always()
        run: |
          ls -la
          echo "CSV preview:"
          cat bonkers_rankings.csv || true

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonkers-debug-files
          path: |
            bonkers_debug.png
            bonkers_debug_text.txt
            bonkers_error.png
            bonkers_rankings.csv

      - name: Commit updated CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add bonkers_rankings.csv

          if git diff --staged --quiet; then
            echo "No CSV changes to commit"
          else
            git commit -m "Auto update Bonkers rankings"
            git push
          fi
