name: Bonkers Scraper

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bonkers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          pip install pandas selenium

      - name: Run Bonkers scraper
        run: |
          python bonkers_scraper.py

      - name: Show generated files
        run: |
          ls -la
          echo "----- CSV -----"
          cat bonkers_rankings.csv || true
          echo "----- DEBUG TXT -----"
          cat bonkers_debug_text.txt || true

      - name: Commit updated files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add bonkers_rankings.csv
          git add bonkers_debug_text.txt || true
          git add bonkers_debug.png || true
          git diff --staged --quiet || git commit -m "Auto update Bonkers rankings"
          git push
