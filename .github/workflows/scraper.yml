name: Energy Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install selenium pandas

      - name: Run scraper
        run: python scraper.py

      - name: Commit ranking files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add energy_rankings.csv
          git add energy_rankings.md
          git add switcher_history.csv
          git diff --staged --quiet || git commit -m "Update Switcher rankings and history"
          git push
